<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Live Translator & Smart Answer Assistant</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error("Window Error:", e);
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-error-box';
          errBox.style = 'color: #f87171; background: #1e1b4b; border: 2px solid #ef4444; padding: 20px; font-family: monospace; font-size: 14px; position: fixed; top: 10px; left: 10px; right: 10px; z-index: 999999; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML += '<div><b>[JS ERROR]</b> ' + e.message + ' (' + (e.filename || '') + ':' + e.lineno + ')</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error("Unhandled Rejection:", e);
      });
    </script>
  </head>
  <body class="text-slate-100 antialiased font-sans select-none overflow-hidden" style="background-color: transparent;">
    <div id="root">
      <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; color: #94a3b8; font-family: system-ui, sans-serif;">
        <div style="width: 36px; height: 36px; border: 3px solid rgba(99, 102, 241, 0.3); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px;"></div>
        <div style="font-size: 14px; font-weight: 600; color: #f8fafc;">AI Live Translator</div>
        <div style="font-size: 11px; margin-top: 4px; opacity: 0.7;">Loading...</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
